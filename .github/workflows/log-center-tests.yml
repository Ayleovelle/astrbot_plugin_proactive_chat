name: 日志中心回归

on:
  push:
    branches: ["feat/log-center-*"]
  pull_request:
    branches: ["log-center-base-*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装隔离测试工具
        run: python -m pip install ruff==0.14.2 mypy==1.18.2 fastapi==0.115.6 uvicorn==0.34.0 httpx==0.28.1
      - name: 代码与类型检查
        run: |
          ruff check .
          ruff format --check .
          mypy --python-version 3.10 --ignore-missing-imports --follow-imports skip --check-untyped-defs core/log_center.py
          python -m compileall -q .
      - name: 实际业务边界隔离回归
        run: python -m unittest discover -s tests -v
      - name: JavaScript 语法检查
        run: |
          node --check admin/js/views/LogsView.js
          node --check tests/log_center.browser.cjs
